# alembic.ini
# -----------
# Alembic configuration file.
# The database URL is overridden in alembic/env.py from pydantic-settings,
# so the sqlalchemy.url here is just a placeholder.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os  # Use OS separator for version file paths

# Placeholder — overridden in env.py
sqlalchemy.url = postgresql+asyncpg://user:pass@localhost/taskdb

# How migration files are named: <timestamp>_<slug>.py
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

[post_write_hooks]
# Uncomment to auto-format new migration files with ruff:
# hooks = ruff
# ruff.type = exec
# ruff.executable = ruff
# ruff.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
