<!DOCTYPE html>
<html>
<head>
    <title>Real-time Task Notifications</title>
    <style>
        :root {
            --primary: #6366f1;
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f8fafc;
            --accent: #22c55e;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            width: 500px;
            background: var(--card);
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            border: 1px solid #334155;
        }
        h1 { font-size: 1.5rem; margin-bottom: 0.5rem; color: var(--primary); }
        #status { font-size: 0.8rem; margin-bottom: 1rem; opacity: 0.7; }
        #notifications {
            height: 400px;
            overflow-y: auto;
            border: 1px solid #334155;
            padding: 15px;
            border-radius: 0.5rem;
            background: #020617;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .notification {
            padding: 10px;
            border-radius: 8px;
            background: #1e293b;
            border-left: 4px solid var(--primary);
            font-size: 0.9rem;
            animation: slideIn 0.3s ease-out;
        }
        .notification.system { border-left-color: #94a3b8; font-style: italic; opacity: 0.7; }
        .notification.new_task { border-left-color: var(--accent); }
        .notification.status_update { border-left-color: #f59e0b; background: rgba(245, 158, 11, 0.1); }
        
        @keyframes slideIn {
            from { transform: translateX(20px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Task Activity Feed</h1>
        <div id="status">Connecting...</div>
        <div id="notifications"></div>
    </div>

    <script>
        const client_id = Date.now();
        const notificationArea = document.getElementById('notifications');
        const statusArea = document.getElementById('status');
        
        // Connect to the notification WebSocket
        const ws = new WebSocket(`ws://${window.location.host}/api/v1/ws/notifications/${client_id}`);

        ws.onopen = () => {
            statusArea.innerHTML = `<span style="color: #22c55e">● Connected (ID: ${client_id})</span>`;
        };

        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            addNotification(data);
        };

        ws.onclose = () => {
            statusArea.innerHTML = `<span style="color: #ef4444">● Disconnected</span>`;
        };

        function addNotification(data) {
            const el = document.createElement('div');
            el.className = `notification ${data.type || ''}`;
            
            const timestamp = new Date().toLocaleTimeString();
            el.innerHTML = `<strong>[${timestamp}]</strong> ${data.message}`;
            
            notificationArea.prepend(el); // Most recent on top
        }
    </script>
</body>
</html>
