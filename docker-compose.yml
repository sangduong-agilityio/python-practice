services:
  app:
    build: .
    command: gunicorn -c gunicorn_conf.py app.main:app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/taskdb
      REDIS_URL: redis://redis:6379/0
      # Keep Celery aligned with README + Settings defaults:
      # - broker: Postgres DB
      # - result backend: Postgres DB
      CELERY_BROKER_URL: sqla+postgresql://postgres:postgres@db:5432/taskdb
      CELERY_RESULT_BACKEND: db+postgresql://postgres:postgres@db:5432/taskdb
      CACHE_TTL_SECONDS: 60
      LOG_LEVEL: INFO
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend

  worker:
    build: .
    # Same image as app, different entrypoint -- keeps the worker in sync
    # with the API codebase without maintaining a separate Dockerfile.
    command: celery -A app.worker.celery_app worker --loglevel=info --concurrency=2
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/taskdb
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: sqla+postgresql://postgres:postgres@db:5432/taskdb
      CELERY_RESULT_BACKEND: db+postgresql://postgres:postgres@db:5432/taskdb
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend

  db:
    image: postgres:16-alpine
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: taskdb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - backend

volumes:
  postgres_data:

networks:
  backend:
    driver: bridge
